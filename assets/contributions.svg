  <text x="60" y="177" fill="#536471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">2</text>
  <text x="60" y="254" fill="#536471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">0</text>

  <polygon points="382.8,250 444.9,96 507.1,250" fill="#1d9bf0" opacity="0.18"/>
  <polygon points="817.8,250 880,173 880,250" fill="#1d9bf0" opacity="0.18"/>
  <polyline points="72,250 134.2,250 196.3,250 258.5,250 320.6,250 382.8,250 444.9,96 507.1,250 569.2,250 631.4,250 693.5,250 755.7,250 817.8,250 880,173" fill="none" stroke="#1d9bf0" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="444.9" cy="96" r="3.5" fill="#1d9bf0"/>
  <circle cx="880" cy="173" r="3.5" fill="#1d9bf0">
