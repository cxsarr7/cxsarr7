  <text x="444.9" y="286" fill="#536471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">18</text>
  <text x="880" y="286" fill="#536471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">25</text>
