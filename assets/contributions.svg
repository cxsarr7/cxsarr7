<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Contribuições</title>
  <desc id="desc">6 contribuições no último ano. 4 em 18 de novembro de 2026 e 2 em 25 de novembro de 2026.</desc>
  <rect width="920" height="320" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="319" fill="none" stroke="#eff3f4"/>
  <text x="32" y="42" fill="#0f1419" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Contribuições</text>
  <text x="32" y="66" fill="#536471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">6 no último ano · 12 a 25 de novembro de 2026</text>

  <line x1="72" y1="96" x2="880" y2="96" stroke="#eff3f4" stroke-width="1"/>
